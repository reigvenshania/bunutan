<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Online Bunutan 2025</title>
  <style>
    body {
      font-family: Poppins, Arial, sans-serif;
      background: #f8f9fd;
      color: #222;
      text-align: center;
      padding: 40px;
    }
    h1 { color: #333; margin-bottom: 10px; }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #45a049; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #drawn, #msg { margin-top: 20px; font-size: 20px; }
    .links { margin-top: 40px; font-size: 16px; }
    a { color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Online Bunutan 2025</h1>
  <p id="msg"></p>
  <button id="drawBtn">Click me! 🎲</button>
  <div id="drawn"></div>
  <div class="links" id="links"></div>

  <script>
    window.onload = () => {

      // FIXED ASSIGNMENT
      const fixedAssignments = {
        "Clem": "Sanja",
        "Elmo": "Simone",
        "Kevin": "Reigven",
        "Reigen": "Clem",
        "Reigne": "Elmo",
        "Reigven": "Sev",
        "Sanja": "Reigen",
        "Sev": "Reigne",
        "Simone": "Kevin"
      };

      const participants = Object.keys(fixedAssignments);

      const params = new URLSearchParams(window.location.search);
      let user = params.get("user");

      // If no user → show clickable name list
      if (!user) {
        document.getElementById("msg").innerHTML = "<b>Click your name below to join:</b>";

        let html = "<ul style='list-style:none;padding:0;'>";
        participants.forEach(name => {
          html += `<li><a href="?user=${encodeURIComponent(name)}">${name}</a></li>`;
        });
        html += "</ul>";

        document.getElementById("links").innerHTML = html;
        document.getElementById("drawBtn").style.display = "none";
        return;
      }

      // Normalize user input
      user = user.trim();
      const match = participants.find(
        n => n.toLowerCase() === user.toLowerCase()
      );

      if (!match) {
        document.body.innerHTML = "<h2>⚠️ Invalid participant link.</h2>";
        return;
      }

      user = match;

      // Greeting text
      document.getElementById("msg").innerHTML = `
        <b>Welcome, ${user}!</b><br>
        Welcome to our exchange gift bunutan! Your assigned name will be picked randomly thru spin the wheel, so  get ready to find out who you'll be giving a gift to this year, proceed to reveal your assigned person once you click the button below.<br><br>

        Participants for this year's exchange gift:<br><br>
        Clem<br>
        Elmo<br>
        Kevin<br>
        Reigen<br>
        Reigne<br>
        Reigven<br>
        Sanja<br>
        Sev<br>
        Simone<br><br>

        Ready? Reveal your bunot below.<br>
      `;

      // Reveal assignment
      const drawBtn = document.getElementById("drawBtn");

      drawBtn.onclick = () => {
        const result = fixedAssignments[user];
        document.getElementById("drawn").innerHTML = `🎉 You got: <b>${result}</b>`;
        drawBtn.disabled = true;
      };
    };
  </script>
</body>
</html>
