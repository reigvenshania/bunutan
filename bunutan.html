<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title> Online Bunutan 2025 </title>

<style>
  body {
    font-family: Poppins, Arial, sans-serif;
    background: #f8f9fd;
    color: #222;
    text-align: center;
    padding: 40px;
  }
  h1 { color: #333; margin-bottom: 10px; }
  button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #45a049; }
  button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  #drawn, #msg {
    margin-top: 20px;
    font-size: 20px;
  }
  .links {
    margin-top: 40px;
    font-size: 16px;
  }
  a {
    color: #007bff;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
  .error {
    color: #b00020;
    font-weight: 600;
    margin-top: 20px;
  }
</style>

</head>
<body>

<h1> Online Bunutan 2025 </h1>

<p id="msg"></p>
<button id="drawBtn">Click me! 🎲</button>
<div id="drawn"></div>
<div class="links" id="links"></div>
<div id="validation" class="error" aria-live="polite"></div>

<script>
/*
  Fixed assignments mapping.
  Keep it here (JSON-style object). If you change names or assignments,
  the page will validate the mapping for duplicates and self-assignments.
*/
const fixedAssignments = {
  "Clem": "Sanja",
  "Elmo": "Simone",
  "Kevin": "Reigven",
  "Reigen": "Clem",
  "Reigne": "Elmo",
  "Reigven": "Sev",
  "Sanja": "Reigen",
  "Sev": "Reigne",
  "Simone": "Kevin"
};

// --- Validation: ensure no duplicate assignees and no self-assignments ---
const officialNames = Object.keys(fixedAssignments).slice(); // participants
const assignedTo = Object.values(fixedAssignments);

// helper to find duplicates in an array
function findDuplicates(arr) {
  const seen = new Set();
  const dups = new Set();
  arr.forEach(v => {
    if (seen.has(v)) dups.add(v);
    seen.add(v);
  });
  return Array.from(dups);
}

const duplicateAssignees = findDuplicates(assignedTo);
const selfAssigned = officialNames.filter(name => fixedAssignments[name] === name);

// check that assignedTo is a permutation of officialNames (same multiset)
function isPermutation(keys, values) {
  if (keys.length !== values.length) return false;
  const cnt = {};
  keys.forEach(k => cnt[k] = (cnt[k] || 0) + 1);
  values.forEach(v => {
    if (!cnt[v]) cnt[v] = (cnt[v] || 0) - 1;
    else cnt[v]--;
  });
  return Object.values(cnt).every(c => c === 0);
}

const mappingValid = duplicateAssignees.length === 0 &&
                     selfAssigned.length === 0 &&
                     isPermutation(officialNames, assignedTo);

// If mapping invalid, show error and stop interactive reveal
if (!mappingValid) {
  const issues = [];
  if (duplicateAssignees.length) {
    issues.push("Duplicate assignees detected: " + duplicateAssignees.join(", "));
  }
  if (selfAssigned.length) {
    issues.push("Self-assignment(s) detected: " + selfAssigned.join(", "));
  }
  if (!isPermutation(officialNames, assignedTo)) {
    issues.push("Assigned names are not the same set as participants (missing or extra names).");
  }
  document.getElementById("validation").textContent = "⚠️ Mapping error — " + issues.join(" • ");
  // show basic participant list but disable draw button
  document.getElementById("msg").innerHTML = `
    <b>Participant list (mapping invalid)</b><br>
    Please check the assignments mapping. Participants:<br><br>
    ${officialNames.join("<br>")}
  `;
  document.getElementById("links").innerHTML = "<p>Please contact the organizer to fix the assignments.</p>";
  document.getElementById("drawBtn").disabled = true;
} else {
  // === Normal operation when mapping is valid ===
  const params = new URLSearchParams(window.location.search);
  let user = params.get("user");

  // === Show all participant links if no ?user provided ===
  if (!user) {
    document.getElementById("msg").innerHTML = "<b>Click your name below to join:</b>";
    let html = "<ul style='list-style:none;padding:0;margin:0;'>";
    officialNames.forEach(name => {
      // use encodeURIComponent for safety and include current pathname
      html += `<li style="margin:6px 0;"><a href="${location.pathname}?user=${encodeURIComponent(name)}">${name}</a></li>`;
    });
    html += "</ul>";
    document.getElementById("links").innerHTML = html;
    // hide draw button since no specific user selected
    document.getElementById("drawBtn").style.display = "none";
  } else {
    // === Normalize username and match case-insensitively ===
    const matched = officialNames.find(n => n.toLowerCase() === user.toLowerCase());
    if (!matched) {
      document.body.innerHTML = "<h2>⚠️ Invalid participant link.</h2>";
      return;
    }
    user = matched;

    document.getElementById("msg").innerHTML = `
      <b>Welcome, ${user}!</b><br>
      Welcome to our exchange gift bunutan! Your assigned name will be picked randomly thru spin the wheel,
      so get ready to find out who you'll be giving a gift to this year. When you're ready,
      proceed to reveal your assigned person for the exchange gift.<br><br>
      Participants for this year's exchange gift:<br><br>
      Clem<br>Elmo<br>Kevin<br>Reigen<br>Reigne<br>Reigven<br>Sanja<br>Sev<br>Simone
      <br><br>Ready? Reveal your bunot below.<br>
    `;

    const drawBtn = document.getElementById("drawBtn");

    drawBtn.onclick = () => {
      // reveal the fixed assignment
      const result = fixedAssignments[user];
      document.getElementById("drawn").innerHTML =
        `🎉 You got: <b>${result}</b>`;
      drawBtn.disabled = true;
    };
  }
}
</script>

</body>
</html>
