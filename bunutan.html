<script>
const assignedKey = "bunutan_assigned_v2";
const params = new URLSearchParams(window.location.search);
let user = params.get("user");

// Load assigned data from browser storage
function saveAssigned(obj){ localStorage.setItem(assignedKey, JSON.stringify(obj)); }
function loadAssigned(){ return JSON.parse(localStorage.getItem(assignedKey) || "{}"); }

// Fetch participant list from names.json
fetch("names.json")
  .then(r => r.json())
  .then(fileNames => {

    // --- FILTER to ensure only the 9 real participants are used ---
    const officialNames = [
      "Clem","Elmo","Kevin","Reigen","Reigne",
      "Reigven","Sanja","Sev","Simone"
    ];

    // Remove anything not part of the official 9
    const allNames = fileNames.filter(n =>
      officialNames.map(x => x.toLowerCase()).includes(n.toLowerCase())
    );

    // === Show list of participants for selecting ===
    if (!user) {
      document.getElementById("msg").innerHTML = "<b>Click your name below to join:</b>";
      let html = "<ul style='list-style:none;padding:0;'>";
      allNames.forEach(name => {
        html += `<li><a href="?user=${encodeURIComponent(name)}">${name}</a></li>`;
      });
      html += "</ul>";
      document.getElementById("links").innerHTML = html;
      document.getElementById("drawBtn").style.display = "none";
      return;
    }

    // === Normalize username and validate ===
    user = user.trim();
    const match = allNames.find(n => n.toLowerCase() === user.toLowerCase());
    if (!match) {
      document.body.innerHTML = "<h2>⚠️ Invalid participant link.</h2>";
      return;
    }
    user = match;

    // Welcome message
    document.getElementById("msg").innerHTML = `
      <b>Welcome, ${user}!</b><br>
      Participants:<br><br>${allNames.join("<br>")}
      <br><br>Ready? Reveal your bunot below.<br>
    `;

    const drawBtn = document.getElementById("drawBtn");
    drawBtn.onclick = () => {
      let assigned = loadAssigned();

      // Already drawn
      if (assigned[user]) {
        document.getElementById("drawn").innerHTML = `This year, you got: <b>${assigned[user]}</b>`;
        drawBtn.disabled = true;
        return;
      }

      const used = Object.values(assigned);
      const available = allNames.filter(n => !used.includes(n) && n !== user);

      if (!available.length) {
        document.getElementById("drawn").innerHTML = "⚠️ No more names left!";
        drawBtn.disabled = true;
        return;
      }

      // Pick random person
      const chosen = available[Math.floor(Math.random() * available.length)];
      assigned[user] = chosen;
      saveAssigned(assigned);

      document.getElementById("drawn").innerHTML = `🎉 You got: <b>${chosen}</b>`;
      drawBtn.disabled = true;
    };
  })
  .catch(err => {
    document.body.innerHTML = `
      <h2>⚠️ Organizer hasn't uploaded the participant list yet.</h2>
      <p>Please add <b>names.json</b> in the same folder.</p>`;
    console.error(err);
  });
</script>
